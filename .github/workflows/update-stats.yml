name: Update Stats packages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update packages from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api repos/priyashpatil/stats/releases/latest)"
          version="$(jq -r '.tag_name | sub("^v"; "")' <<<"$release")"
          cask_digest="$(jq -r --arg name "Stats-${version}-macOS-arm64.zip" \
            '.assets[] | select(.name == $name) | .digest' <<<"$release")"
          formula_digest="$(jq -r --arg name "stats-${version}-macOS-arm64.tar.gz" \
            '.assets[] | select(.name == $name) | .digest' <<<"$release")"
          cask_sha256="${cask_digest#sha256:}"
          formula_sha256="${formula_digest#sha256:}"

          test -n "$version"
          test "$cask_sha256" != "$cask_digest"
          test "$formula_sha256" != "$formula_digest"

          sed -i -E "s/version \"[^\"]+\"/version \"${version}\"/" Casks/stats.rb
          sed -i -E "s/sha256 \"[0-9a-f]+\"/sha256 \"${cask_sha256}\"/" Casks/stats.rb
          sed -i -E "s|/v[0-9.]+/stats-[0-9.]+-macOS|/v${version}/stats-${version}-macOS|" Formula/stats.rb
          sed -i -E "s/sha256 \"[0-9a-f]+\"/sha256 \"${formula_sha256}\"/" Formula/stats.rb

          if git diff --quiet; then
            echo "Stats packages are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/stats.rb Formula/stats.rb
          git commit -m "Update Stats to ${version}"
          git push
