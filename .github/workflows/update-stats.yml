name: Update Stats cask

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api repos/priyashpatil/stats/releases/latest)"
          version="$(jq -r '.tag_name | sub("^v"; "")' <<<"$release")"
          digest="$(jq -r --arg name "Stats-${version}-macOS-arm64.zip" \
            '.assets[] | select(.name == $name) | .digest' <<<"$release")"
          sha256="${digest#sha256:}"

          test -n "$version"
          test "$sha256" != "$digest"

          sed -i -E "s/version \"[^\"]+\"/version \"${version}\"/" Casks/stats.rb
          sed -i -E "s/sha256 \"[0-9a-f]+\"/sha256 \"${sha256}\"/" Casks/stats.rb

          if git diff --quiet; then
            echo "Cask is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/stats.rb
          git commit -m "Update Stats to ${version}"
          git push
